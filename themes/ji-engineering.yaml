      dark-primary-color: "#0F47A3"
      accent-color: "#189CE4"
      primary-background-color: "#EEF0F3"
      secondary-background-color: "#F2F4F7"
      card-background-color: "#FFFFFF"
      ha-card-background: "#FFFFFF"
      ha-card-border-color: "#E4E7EC"
      divider-color: "#E4E7EC"
      app-header-background-color: "#FFFFFF"
      app-header-text-color: "#101828"
      app-header-selection-bar-color: "#1557C0"
      sidebar-background-color: "#FFFFFF"
