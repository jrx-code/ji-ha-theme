# =============================================================================
# JI Engineering Style — Home Assistant theme pack
# Generated from the design system's single source of truth:
#   web/ji.css (base role tokens) + themes/<name>.css (per-theme overrides).
# Do not hand-edit: change tokens.json / the CSS and regenerate.
#
# Each theme carries light + dark modes (auto-follows HA's dark mode setting).
# Colours, semantics and tight radii apply with the theme alone. Two optional
# extras, both degrading silently if missing:
#   * fonts   -> ji-font.js wired via frontend.extra_module_url (see README)
#   * the channel-tick bar on cards -> lovelace-card-mod (HACS)
# =============================================================================

# JI Engineering — Brand blue #1557C0 — the default JI identity.
"JI Engineering":
  # typefaces (registered by ji-font.js via frontend.extra_module_url; falls back if absent)
  ji-font-sans: "'Manrope', 'Helvetica Neue', Helvetica, Arial, sans-serif"
  ji-font-mono: "'JetBrains Mono', 'SF Mono', 'Roboto Mono', ui-monospace, monospace"
  ha-font-family-body: var(--ji-font-sans)
  ha-font-family-heading: var(--ji-font-sans)
  ha-font-family-longform: var(--ji-font-sans)
  primary-font-family: var(--ji-font-sans)
  paper-font-common-base_-_font-family: var(--ji-font-sans)
  code-font-family: var(--ji-font-mono)
  mdc-typography-body1-font-family: var(--ji-font-sans)
  mdc-typography-body2-font-family: var(--ji-font-sans)
  mdc-typography-subtitle1-font-family: var(--ji-font-sans)
  mdc-typography-subtitle2-font-family: var(--ji-font-sans)
  mdc-typography-caption-font-family: var(--ji-font-sans)
  mdc-typography-button-font-family: var(--ji-font-sans)
  mdc-typography-headline6-font-family: var(--ji-font-sans)
  mdc-typography-overline-font-family: var(--ji-font-sans)
  # tight JI radii (buttons/chips 5, cards 8)
  ha-card-border-radius: "8px"
  mdc-shape-small: "5px"
  mdc-shape-medium: "8px"
  mdc-shape-large: "8px"
  ha-card-border-width: "1px"
  button-card-border-radius: "5px"
  card-mod-theme: "JI Engineering"
  card-mod-card: |
    ha-card {
      position: relative;
      border: 1px solid var(--ha-card-border-color);
    }
    ha-card::after {
      content: "";
      position: absolute;
      left: 0;
      top: 16px;
      width: 3px;
      height: 20px;
      border-radius: 0 2px 2px 0;
      background: var(--ji-primary, var(--primary-color));
      z-index: 1;
      pointer-events: none;
    }
  modes:
    light:
      primary-text-color: "#101828"
      secondary-text-color: "#475467"
      text-primary-color: "#fff"
      disabled-text-color: "#D0D5DD"
